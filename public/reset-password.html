<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reset Password - Denla Discount</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">
    
    <!-- Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
    
    
</head>

<body class="reset-page">
    <div class="container">
        <div class="reset-container mx-auto">
            <div class="text-center mb-4">
                <i class="fas fa-key text-primary fa-4x mb-3"></i>
                <h2 class="fw-bold">Reset Your Password</h2>
                <p class="text-muted">Enter your new password below</p>
            </div>
            
            <!-- Alert Area -->
            <div id="alert" class="alert alert-dismissible fade" role="alert" style="display: none;">
                <i class="fas fa-info-circle me-2"></i>
                <span id="alertMessage"></span>
                <button type="button" class="btn-close" onclick="document.getElementById('alert').style.display='none'"></button>
            </div>
            
            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="fas fa-lock text-primary"></i>
                        </span>
                        <input type="password" id="password" class="form-control border-start-0 py-3"
                            placeholder="Enter new password" required minlength="6">
                    </div>
                    <small class="text-muted">Password must be at least 6 characters</small>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="fas fa-lock text-primary"></i>
                        </span>
                        <input type="password" id="confirmPassword" class="form-control border-start-0 py-3"
                            placeholder="Confirm new password" required minlength="6">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold mb-3" id="resetBtn">
                    <i class="fas fa-check me-2"></i>Reset Password
                </button>
                
                <div class="text-center">
                    <a href="index.html" class="text-primary text-decoration-none">
                        <i class="fas fa-arrow-left me-2"></i>Back to Home
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api' 
            : '/api';

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showAlert('danger', 'Invalid reset link. Please request a new password reset.');
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            if (password !== confirmPassword) {
                showAlert('danger', 'Passwords do not match');
                return;
            }
            
            if (password.length < 6) {
                showAlert('danger', 'Password must be at least 6 characters long');
                return;
            }
            
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Resetting...';
            
            try {
                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('success', data.message);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showAlert('danger', data.message || 'Failed to reset password');
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="fas fa-check me-2"></i>Reset Password';
                }
            } catch (error) {
                showAlert('danger', 'Network error. Please try again.');
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-check me-2"></i>Reset Password';
            }
        });

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            const alertMessage = document.getElementById('alertMessage');
            
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alertMessage.textContent = message;
            alert.style.display = 'block';
        }
    </script>
</body>
</html>
